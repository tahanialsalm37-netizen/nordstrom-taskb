name: taskb-monitor
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'   # 每4小时（UTC，对应北京 08:17 / 12:17 / 16:17 / 20:17 / 00:17 / 04:17）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup mihomo + pick proxy node
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python -m pip install --quiet pyyaml
          URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -o '"browser_download_url": *"[^"]*mihomo-linux-amd64-v[0-9.]*\.gz"' | head -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          echo "mihomo: $URL"
          curl -sL -o mihomo.gz "$URL" && gunzip -f mihomo.gz && chmod +x mihomo
          python scripts/select_node.py

      - name: Install deps + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run monitor (scrape + full stock sweep + thresholds + bark)
        run: node src/run.js
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SUB_URL: ${{ secrets.SUB_URL }}
          ND_COOKIES: ${{ secrets.ND_COOKIES }}
          ND_PROXY: http://127.0.0.1:7890
          DASH_URL: https://tahanialsalm37-netizen.github.io/nordstrom-taskb/

      - name: Refresh cookies secret
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node src/dump_cookies.js
          python -m pip install --quiet pynacl
          python scripts/update_cookie_secret.py

      - name: Generate panel
        if: always()
        run: |
          node src/panel.js
          cp reports/panel.html reports/index.html

      - name: Commit data back
        if: always()
        run: |
          git config user.name "taskb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          git commit -m "taskb run $(date -u '+%FT%TZ')" || echo "no changes"
          git push

      - name: Deploy panel to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./reports
          publish_branch: gh-pages
          force_orphan: true
